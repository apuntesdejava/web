services:
  jekyll:
    image: ruby:3.2-bookworm
    working_dir: /site
    command: >-
      sh -c "bundle config set path /usr/local/bundle
      && bundle install
      && bundle exec jekyll serve --host 0.0.0.0 --port 4000 --force_polling"
    ports:
      - "4000:4000"
    volumes:
      - .:/site
      - jekyll_gems:/usr/local/bundle
    environment:
      JEKYLL_ENV: development

volumes:
  jekyll_gems:
