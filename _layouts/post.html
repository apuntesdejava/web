---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%Y-%m-%d" }}{% if page.author %} | {{ page.author }}{% endif %}</p>
  {% if page.tags %}
  <p class="meta">Tags: {% for tag in page.tags %}<a href="{{ site.baseurl }}/tags/{{ tag | slugify }}/">{{ tag }}</a>{% unless forloop.last %}, {% endunless %}{% endfor %}</p>
  {% endif %}
  {{ content }}
</article>
