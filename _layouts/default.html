<!doctype html>
<html lang="{{ site.lang | default: 'es' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
  <meta name="theme-color" content="#6f3b20">
  {% if page.canonical_url %}<link rel="canonical" href="{{ page.canonical_url }}">{% else %}<link rel="canonical" href="{{ page.url | absolute_url }}">{% endif %}
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#contenido">Ir al contenido</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}, inicio">
        <span class="brand-mark" aria-hidden="true">{ }</span>
        <span><strong>Apuntes</strong><small>de Java</small></span>
      </a>
      <nav class="main-nav" aria-label="Navegación principal">
        <a href="{{ '/' | relative_url }}">Inicio</a>
        <a href="{{ '/archive/' | relative_url }}">Archivo</a>
        <a href="{{ '/tags/' | relative_url }}">Temas</a>
        <a href="{{ '/p/acerca-del-autor.html' | relative_url }}">Acerca de</a>
        <a class="search-link" href="{{ '/search/' | relative_url }}" aria-label="Buscar">Buscar</a>
      </nav>
    </div>
  </header>
  <main id="contenido" class="site-main">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <a class="footer-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <p>{{ site.description }}</p>
      </div>
      <nav aria-label="Navegación secundaria">
        <a href="{{ '/archive/' | relative_url }}">Archivo</a>
        <a href="{{ '/tags/' | relative_url }}">Temas</a>
        <a href="{{ '/p/politica-de-privacidad.html' | relative_url }}">Privacidad</a>
      </nav>
      <p class="copyright">&copy; {{ 'now' | date: '%Y' }} {{ site.author.name }}</p>
    </div>
  </footer>
</body>
</html>
