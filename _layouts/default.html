<!doctype html>
<html lang="{{ site.lang | default: 'es' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  {% if page.description %}<meta name="description" content="{{ page.description | escape }}">{% endif %}
  {% if page.canonical_url %}<link rel="canonical" href="{{ page.canonical_url }}">{% endif %}
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <header>
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/archive/' | relative_url }}">Archivo</a>
      <a href="{{ '/tags/' | relative_url }}">Tags</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
</body>
</html>
